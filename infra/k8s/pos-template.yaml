apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{name}}
  namespace: {{namespace}}
spec:
  selector:
    matchLabels:
      app: {{name}}
  replicas: 1
  revisionHistoryLimit: 5
  minReadySeconds: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: {{name}}
    spec:
      containers:
      - name: {{containerName}}
        image: asia-southeast1-docker.pkg.dev/fpg-retail/pos/{{name}}:20260523125657-278927a640ff8f910150c1cf05f2f43373417443l
        env:
        - name: SERVICE_NAME
          value: {{name}}
        - name: SW_AGENT_NAME
          value: {{name}}
        envFrom: 
        - configMapRef:
            name: conf-env-center
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8081
        resources:
          requests:
            memory: "3072Mi"
          limits:
            memory: "4096Mi"
        livenessProbe:
           failureThreshold: 3
           httpGet:
              path: /health
              port: 8081
              scheme: HTTP
           initialDelaySeconds: 5
           periodSeconds: 5
           successThreshold: 1
           timeoutSeconds: 5
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /health
            port: 8081
            scheme: HTTP
          initialDelaySeconds: 5
          periodSeconds: 5
          successThreshold: 1
          timeoutSeconds: 5
        startupProbe:
          failureThreshold: 30
          httpGet:
            path: /health
            port: 8081
            scheme: HTTP
          initialDelaySeconds: 30
          periodSeconds: 5
          successThreshold: 1
          timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: {{name}}
  namespace: {{namespace}}
spec:
  selector:
    app: {{name}}
  ports:
  - protocol: TCP
    port: 8081
    targetPort: 8081